# Paste these location blocks INSIDE the creditlab.in `server { }` for port 443
# (before the generic `location ~ \.php$` block).
# Then: sudo nginx -t && sudo systemctl reload nginx

# Probe files (.env, .bak, .git) — 404 without opening the file
location ~ /\.(?!well-known) {
    access_log off;
    log_not_found off;
    return 404;
}

location ~* \.(bak|env|sql|git|svn|swp)$ {
    access_log off;
    log_not_found off;
    return 404;
}

# Cron / bulk SMS helpers (CLI only)
location ~* ^/(zzautosms|send_missing_docs_sms|scripts/) {
    allow 127.0.0.1;
    deny all;
    access_log off;
}

# OTP API — POST /user/register.php (also resend from confirm.php)
location = /user/register.php {
    limit_except POST {
        deny all;
    }
    limit_req zone=creditlab_otp burst=1 nodelay;
    limit_req_status 429;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
