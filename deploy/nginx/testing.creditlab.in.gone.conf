# Disable testing.creditlab.in (do not serve the app).
# Install:
#   sudo cp deploy/nginx/testing.creditlab.in.gone.conf /etc/nginx/sites-available/testing.creditlab.in
#   sudo ln -sfn /etc/nginx/sites-available/testing.creditlab.in /etc/nginx/sites-enabled/testing.creditlab.in
# If the Let's Encrypt testing cert is missing, point ssl_* at creditlab.in's certs.
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name testing.creditlab.in;
    return 404;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name testing.creditlab.in;

    ssl_certificate /etc/letsencrypt/live/testing.creditlab.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testing.creditlab.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 404;
}
